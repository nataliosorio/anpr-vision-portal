server {
    listen 80;
    server_name _;

    # 📂 Archivos estáticos de Angular
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------
    # 🧱 Cacheo de archivos estáticos
    # ------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ------------------------------------------------------
    # ⚙️ Proxy a la API .NET (backend ejecutándose en el host local)
    # ------------------------------------------------------
    location /api {
        proxy_pass http://host.docker.internal:5200/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ------------------------------------------------------
    # 🔌 Proxy a SignalR (WebSockets)
    # ------------------------------------------------------
    location /parkingHub {
        proxy_pass http://host.docker.internal:5200/parkingHub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ------------------------------------------------------
    # 🧭 Routing SPA (Angular)
    # ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
