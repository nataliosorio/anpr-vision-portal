server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 🔁 Proxy de backend local (.NET en el mismo entorno Docker)
  location /api/ {
    proxy_pass http://anprvision-api-${ENVIRONMENT}:8080;  # dinámico según entorno
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 🔁 Proxy de SignalR (ParkingHub)
  location /parkingHub {
    proxy_pass http://anprvision-api-${ENVIRONMENT}:8080/parkingHub;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # 🧩 Resto de archivos Angular SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
