server {
    listen 80;
    server_name _;

    # 📂 Archivos estáticos compilados de Angular
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------
    # 🧱 Cache de archivos estáticos (mejor rendimiento)
    # ------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ------------------------------------------------------
    # 🚫 Sin proxy aquí: el reverse proxy principal (nginx-proxy)
    #     en el servidor EC2 es quien enruta /api y /parkingHub.
    # ------------------------------------------------------

    # ------------------------------------------------------
    # 🧭 Routing Angular (SPA fallback)
    # ------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
