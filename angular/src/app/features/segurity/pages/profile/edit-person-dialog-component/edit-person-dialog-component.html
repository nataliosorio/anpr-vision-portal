  <div class="edit-user-modal" role="dialog" aria-labelledby="editUserTitle" aria-describedby="editUserDesc">
    <div class="modal-head">
    <div class="modal-icon" aria-hidden="true"><i class="fas fa-user-edit"></i></div>
    <h2 id="editUserTitle">Editar Información personal</h2>
    <button class="close-btn" mat-icon-button aria-label="Cerrar" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

   <div class="modal-body" mat-dialog-content>
     <p id="editUserDesc" class="sr-only">Formulario para actualizar datos personales.</p>

     <div class="form-grid">
       <mat-form-field appearance="outline" class="form-field">
         <mat-label>Nombres</mat-label>
         <input matInput [(ngModel)]="data.firstName" placeholder="Ingrese sus nombres">
         <mat-icon matPrefix class="field-icon">person</mat-icon>
       </mat-form-field>

       <mat-form-field appearance="outline" class="form-field">
         <mat-label>Apellidos</mat-label>
         <input matInput [(ngModel)]="data.lastName" placeholder="Ingrese sus apellidos">
         <mat-icon matPrefix class="field-icon">person_outline</mat-icon>
       </mat-form-field>

       <mat-form-field appearance="outline" class="form-field">
         <mat-label>Número de teléfono</mat-label>
         <input matInput [(ngModel)]="data.phone" placeholder="Ingrese su teléfono" type="tel">
         <mat-icon matPrefix class="field-icon">phone</mat-icon>
       </mat-form-field>

       <mat-form-field appearance="outline" class="form-field">
         <mat-label>Documento de identidad</mat-label>
         <input matInput [(ngModel)]="data.document" placeholder="Ingrese su documento">
         <mat-icon matPrefix class="field-icon">badge</mat-icon>
       </mat-form-field>

       <mat-form-field appearance="outline" class="form-field full-width">
         <mat-label>Edad</mat-label>
         <input matInput [(ngModel)]="data.age" placeholder="Ingrese su edad" type="number" min="1" max="120">
         <mat-icon matPrefix class="field-icon">calendar_today</mat-icon>
       </mat-form-field>
     </div>


  <div mat-dialog-actions class="modal-actions" align="end">
    <button mat-stroked-button type="button" (click)="onCancel()" aria-label="Cancelar" class="btn-cancel">Cancelar</button>
    <button mat-flat-button color="primary" type="button" (click)="onSave()" aria-label="Guardar" class="btn-save">Guardar</button>
  </div>
