version: '3.8'

services:
  anprvision-front-prod:
    container_name: anprvision-front-prod
    build:
      context: ../..
      dockerfile: angular/Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONT_PORT}:80"
    networks:
      - anprvision_network
    labels:
      - com.anprvision.environment=prod

networks:
  anprvision_network:
    external: true
