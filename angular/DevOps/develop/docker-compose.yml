version: '3.8'

services:
  anprvision-front-develop:
    container_name: anprvision-front-develop
    build:
      context: ../..           # raíz del repo
      dockerfile: angular/Dockerfile
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONT_PORT}:80"
    networks:
      - anprvision_network
    labels:
      - com.anprvision.environment=develop

networks:
  anprvision_network:
    external: true
